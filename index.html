<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অঙ্গনওয়াড়ি প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap">
<style>
/* Layout: single centred column, one question per screen, thumb-reachable buttons */
:root{
  --bg:#f3f6f2; --card:#ffffff; --ink:#1b2620; --muted:#5d6b63; --line:#d9e2db;
  --accent:#1e6b52; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c2412d; --bad-soft:#fbe5e0;
  --gold:#d99a14; --gold-soft:#fbf0d6;
  --f-body:"Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --f-display:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --fs:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1b231f; --ink:#e7eee9; --muted:#9db0a5; --line:#2c3832;
  --accent:#4cb48c; --accent-ink:#0d1712; --accent-soft:#1f3329;
  --ok:#55c486; --ok-soft:#1c3427; --bad:#ef7a64; --bad-soft:#3a2420;
  --gold:#e9b649; --gold-soft:#352c17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1b231f; --ink:#e7eee9; --muted:#9db0a5; --line:#2c3832;
  --accent:#4cb48c; --accent-ink:#0d1712; --accent-soft:#1f3329;
  --ok:#55c486; --ok-soft:#1c3427; --bad:#ef7a64; --bad-soft:#3a2420;
  --gold:#e9b649; --gold-soft:#352c17; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.45em;line-height:1.2;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tiny{font-size:.88em;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:.9em;min-height:44px;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:1em;font-weight:600;margin:0;color:var(--muted);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:.95em;min-height:48px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{opacity:.75;font-size:.85em;margin-left:4px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:18px;background:var(--accent);color:var(--accent-ink);font-size:1.1em;font-weight:700}
.big.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.big:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.88em;color:var(--muted)}
/* quiz */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .prog{order:9;flex-basis:100%}
.bar .count{margin-left:auto}
.prog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-size:.95em;color:var(--muted);white-space:nowrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8em;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.paper{background:var(--gold-soft);color:var(--ink)}
.q{font-size:1.12em;line-height:1.6;font-weight:600;margin:0;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 12px;font-size:1.05em;line-height:1.5}
.opt .k{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:.85em}
.opt span:last-child{min-width:0;padding-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.verdict{font-weight:700;font-size:1.05em}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.learn{border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:12px;font-weight:600;width:100%}
.explain{background:var(--accent-soft);border-radius:14px;padding:14px;white-space:pre-line;font-size:1em;line-height:1.65}
.explain .src{display:block;margin-top:10px;font-size:.85em;color:var(--muted)}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.95em}
.nav{display:flex;gap:10px}
.nav .big{flex:1}
.nav .big.alt{flex:0 0 auto;width:auto;padding-inline:20px}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.score{font-family:var(--f-display);font-size:3.2em;line-height:1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

tions": ["৩৪০ কিমি", "৫৯৫ কিমি", "৪২৫ কিমি", "৫১০ কিমি"], "answer": 2, "answer_source": "claude", "explain": "১. মোট সময় ৬ ঘণ্টা, তার মধ্যে ১ ঘণ্টা দাঁড়িয়ে ছিল।\n২. তাই ট্রেন চলেছে = ৬ − ১ = ৫ ঘণ্টা।\n৩. দূরত্ব = গতিবেগ × সময় = ৮৫ × ৫ = ৪২৫ কিমি।\nউত্তর: ৪২৫ কিমি"}, {"id": "medinipur-w22-math04", "paper": "পশ্চিম মেদিনীপুর কর্মী ২০২২", "subject": "math", "q": "২০ টাকায় একটি ব্যাগ কিনে ১৭ টাকায় বিক্রি করলে শতকরা কত ক্ষতি হয়?", "options": ["১৫%", "১২%", "১৭.৬%", "৩%"], "answer": 0, "answer_source": "claude", "explain": "১. ক্ষতি = ক্রয়মূল্য − বিক্রয়মূল্য = ২০ − ১৭ = ৩ টাকা।\n২. শতকরা ক্ষতি = (ক্ষতি ÷ ক্রয়মূল্য) × ১০০ = (৩ ÷ ২০) × ১০০।\n৩. = ১৫%।\nউত্তর: ১৫%"}, {"id": "medinipur-w22-math05", "paper": "পশ্চিম মেদিনীপুর কর্মী ২০২২", "subject": "math", "q": "রাম ও রহিমের বর্তমান বয়সের অনুপাত ৩ : ৪। ৫ বছর আগে তাদের বয়সের অনুপাত ছিল ৫ : ৭। তাদের বর্তমান বয়স কত?", "options": ["১৫ বছর ও ২০ বছর", "৪৫ বছর ও ৬০ বছর", "৩০ বছর ও ৪০ বছর", "২৪ বছর ও ৩২ বছর"], "answer": 2, "answer_source": "claude", "explain": "১. ধরি, রামের বর্তমান বয়স = ৩ক, রহিমের = ৪ক।\n২. ৫ বছর আগে: (৩ক − ৫) : (৪ক − ৫) = ৫ : ৭।\n৩. আড়গুণ করে: ৭(৩ক − ৫) = ৫(৪ক − ৫) → ২১ক − ৩৫ = ২০ক − ২৫ → ক = ১০।\n৪. রামের বয়স = ৩ × ১০ = ৩০ বছর, রহিমের = ৪ × ১০ = ৪০ বছর।\n৫. যাচাই: ৫ বছর আগে ২৫ ও ৩৫, ২৫ : ৩৫ = ৫ : ৭ ✔\nউত্তর: রাম ৩০ বছর, রহিম ৪০ বছর"}, {"id": "medinipur-w22-math06", "paper": "পশ্চিম মেদিনীপুর কর্মী ২০২২", "subject": "math", "q": "একটি বর্গক্ষেত্রের একটি বাহু ৩৫ মিটার। একটি বালক ঘণ্টায় ৯ কিলোমিটার বেগে দৌড়াতে পারলে বর্গক্ষেত্রটি একবার ঘুরে দৌড়াতে তার কত সময় লাগবে?", "options": ["৪৮ সেকেন্ড", "৫৬ সেকেন্ড", "১৪০ সেকেন্ড", "৬০ সেকেন্ড"], "answer": 1, "answer_source": "claude", "explain": "১. বর্গক্ষেত্রের পরিসীমা = ৪ × বাহু = ৪ × ৩৫ = ১৪০ মিটার।\n২. বেগ = ঘণ্টায় ৯ কিমি = ৯০০০ মিটার ÷ ৩৬০০ সেকেন্ড = সেকেন্ডে ২.৫ মিটার।\n৩. সময় = দূরত্ব ÷ বেগ = ১৪০ ÷ ২.৫ = ৫৬ সেকেন্ড।\nউত্তর: ৫৬ সেকেন্ড"}, {"id": "medinipur-w22-math07", "paper": "পশ্চিম মেদিনীপুর কর্মী ২০২২", "subject": "math", "q": "১৬০০ মিটার লম্ _source": "claude", "explain": "দেউচা পাঁচামি কয়লা খনি বীরভূম জেলায় (মহম্মদবাজার ব্লক)। এটি ভারতের বৃহত্তম ও বিশ্বের অন্যতম বড় কয়লা ব্লক।"}, {"id": "murshidabad-h23-13", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "english", "q": "Which is not the synonym of the word Bad? (কোনটি 'Bad' শব্দের সমার্থক নয়?)", "options": ["Poor", "Inferior", "Deficient", "Pleasant"], "answer": 3, "answer_source": "claude", "explain": "Bad মানে খারাপ। Poor, Inferior, Deficient — সবগুলিই 'খারাপ/নিম্নমানের' অর্থ বোঝায়। Pleasant মানে মনোরম/ভালো — এটি Bad-এর বিপরীত।"}, {"id": "murshidabad-h23-14", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "math", "q": "এক ব্যবসায়ী 30 টাকা কেজি দরের 12 কেজি চালের সঙ্গে 40 টাকা কেজি দরের 8 কেজি চাল মেশালো। এর পরে সে সেই পুরো চালটি 740 টাকায় বিক্রি করলো। তাহলে সে মোট কত টাকা লাভ করলো?", "options": ["100 টাকা", "40 টাকা", "30 টাকা", "60 টাকা"], "answer": 3, "answer_source": "claude", "explain": "১. প্রথম চালের দাম = 12 × 30 = 360 টাকা\n২. দ্বিতীয় চালের দাম = 8 × 40 = 320 টাকা\n৩. মোট ক্রয়মূল্য = 360 + 320 = 680 টাকা\n৪. লাভ = বিক্রয়মূল্য − ক্রয়মূল্য = 740 − 680 = 60 টাকা\nউত্তর: 60 টাকা"}, {"id": "murshidabad-h23-15", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "gk", "q": "নীচের কোন দেশের সাথে ভারতের সর্বোচ্চ দৈর্ঘ্য আন্তর্জাতিক সীমান্ত রয়েছে?", "options": ["পাকিস্তান", "চীন", "বাংলাদেশ", "নেপাল"], "answer": 2, "answer_source": "claude", "explain": "ভারতের সবচেয়ে দীর্ঘ স্থলসীমান্ত বাংলাদেশের সঙ্গে (প্রায় ৪০৯৬ কিমি)। দ্বিতীয় চীন (প্রায় ৩৪৮৮ কিমি)। পশ্চিমবঙ্গের সঙ্গেই বাংলাদেশের সীমান্ত সবচেয়ে বেশি।"}, {"id": "murshidabad-h23-16", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "math", "q": "যদি A:B:C = 2:3:4 হয়, তাহলে (A/B):(B/C):(C/A)-এর মান কত হবে?", "options": ["8:9:16", "8:9:12", "8:9:24", "4:9:16"], "answer": 2, "answer_source": "claude", "explain": "১. ধরি A = 2, B = 3, C = 4\n২. A/B = 2/3, B/C = 3/4, C/A = 4/2 = 2\n৩. ভগ্নাংশ সরাতে হরগুলির (3, 4) ল.সা.গু. 12 দিয়ে গুণ করি:\n   2/3 × 12 = 8, 3/4 × 12 = 9, 2 × 12 = 24\n৪. অনুপাত = 8 : 9 : 24\nউত্তর: 8:9:24"}, {"id": "murshidabad-h23-17", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "gk", "q": "খেলাধুলায় ভারতীয় পুরস্কার এবং সম্মানের প্রসঙ্গে, নিম্নলিখিতগুলির মধ্যে কোনটিকে লাইফ টাইম অ্যাচিভমেন্ট অ্যাওয়ার্ড হিসাবে দেওয়া হয়?", "options": ["দ্রোণাচার্য পুরস্কার", "রাজীব গান্ধী খেলরত্ন পুরস্কার", "ধ্যানচাঁদ পুরস্কার", "অর্জুন পুরস্কার"], "answer": 2, "answer_source": "claude", "explain": "ধ্যানচাঁদ পুরস্কার খেলাধুলায় আজীবন কৃতিত্বের (Lifetime Achievement) জন্য দেওয়া হয়। দ্রোণাচার্য পুরস্কার দেওয়া হয় কোচদের, অর্জুন পুরস্কার খেলোয়াড়দের। খেলরত্নের নাম এখন 'মেজর ধ্যানচাঁদ খেলরত্ন'।"}, {"id": "murshidabad-h23-18", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "gk", "q": "বিখ্যাত প্রত্নতত্ত্ববিদ রাখালদাস বন্দ্যোপাধ্যায় পশ্চিমবঙ্গের কোন জেলায় জন্মগ্রহণ করেন?", "options": ["মুর্শিদাবাদ", "জলপাইগুড়ি", "কলকাতা", "হুগলী"], "answer": 0, "answer_source": "claude", "explain": "রাখালদাস বন্দ্যোপাধ্যায় ১৮৮৫ সালে মুর্শিদাবাদ জেলার বহরমপুরে জন্মগ্রহণ করেন। তিনি ১৯২২ সালে মহেঞ্জোদারো আবিষ্কারের জন্য বিখ্যাত।"}, {"id": "murshidabad-h23-19", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "english", "q": "I have two ______ in my hand. Fill in the blank with proper word. (শূন্যস্থানে সঠিক শব্দ বসান)", "options": ["pencil", "pencils", "eraser", "pen"], "answer": 1, "answer_source": "claude", "explain": "'two' মানে দুটি — তাই বহুবচন বিশেষ্য লাগবে। বিকল্পগুলির মধ্যে একমাত্র বহুবচন হল pencils।"}, {"id": "murshidabad-h23-20", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "health", "q": "আপেলে কোন অ্যাসিড থাকে?", "options": ["হাইড্রোক্লোরিক অ্যাসিড", "সালফিউরিক অ্যাসিড", "ম্যালিক অ্যাসিড", "নাইট্রিক অ্যাসিড"], "answer": 2, "answer_source": "claude", "explain": "আপেলে ম্যালিক অ্যাসিড থাকে। মনে রাখুন: লেবুতে সাইট্রিক, তেঁতুলে টারটারিক, দইয়ে ল্যাকটিক, ভিনিগারে অ্যাসিটিক অ্যাসিড।"}, {"id": "murshidabad-h23-21", "paper": "মুর্শিদাবাদ সহায়িকা ২০২৩", "subject": "gk", "q": "ভারতে সর্বপ্রথম কোন শহরে মাটির নীচ দিয়ে ট্রেন চলেছিল?", "options": ["মু s": ["126", "122", "128", "124"], "answer": 3, "answer_source": "claude", "explain": "১. প্রতিটি স্তম্ভের উপরের তিনটি সংখ্যা গুণ করে 2 বিয়োগ করলে নিচের সংখ্যা পাওয়া যায়।\n২. 3×4×5 − 2 = 58; 5×6×2 − 2 = 58; 8×4×2 − 2 = 62\n৩. শেষ স্তম্ভ: 7×6×3 − 2 = 126 − 2 = 124\nউত্তর: 124"}, {"id": "sup-pre19-6", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "বেলজিয়ামের রাজধানী হল", "options": ["প্রাগ", "সোফিয়া", "ব্রাসেলস", "ব্রাসিলিয়া"], "answer": 2, "answer_source": "claude", "explain": "বেলজিয়ামের রাজধানী ব্রাসেলস। মনে রাখুন: প্রাগ চেক প্রজাতন্ত্রের, সোফিয়া বুলগেরিয়ার, ব্রাসিলিয়া ব্রাজিলের রাজধানী।"}, {"id": "sup-pre19-7", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "কবিতার আয় সবিতার আয় অপেক্ষা 10% বেশি। সবিতার আয় কবিতার আয় অপেক্ষা কত কম?", "options": ["9%", "9 1/11 %", "10%", "10 1/11 %"], "answer": 1, "answer_source": "claude", "explain": "১. ধরি সবিতার আয় 100 টাকা, তাহলে কবিতার আয় 110 টাকা।\n২. সবিতার আয় কম = 110 − 100 = 10 টাকা।\n৩. শতকরা কম = (10 ÷ 110) × 100 = 100/11 = 9 1/11 %\nউত্তর: 9 1/11 %"}, {"id": "sup-pre19-8", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "নিম্নলিখিত বিন্যাসে 10তম সংখ্যাটি কী হবে?\n7, 14, 28, ...", "options": ["1792", "2456", "3584", "4096"], "answer": 2, "answer_source": "claude", "explain": "১. প্রতিটি পদ আগের পদের দ্বিগুণ (গুণোত্তর প্রগতি, সাধারণ অনুপাত 2)।\n২. n-তম পদ = 7 × 2^(n−1)\n৩. 10তম পদ = 7 × 2^9 = 7 × 512 = 3584\nউত্তর: 3584"}, {"id": "sup-pre19-9", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি ক্লাবে যতজন সদস্য ছিলেন, প্রত্যেকে ততগুলি 10 টাকা দেওয়ায় মোট 4000 টাকা চাঁদা উঠল। ওই ক্লাবের সদস্য সংখ্যা কত?", "options": ["40", "30", "20", "10"], "answer": 2, "answer_source": "claude", "explain": "১. ধরি সদস্য সংখ্যা x। প্রত্যেকে দিলেন x × 10 টাকা।\n২. মোট চাঁদা = x × 10x = 10x² = 4000\n৩. x² = 400, তাই x = 20\nযাচাই: 20 জন × 200 টাকা = 4000 টাকা।\nউত্তর: 20"}, {"id": "sup-pre19-10", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "একটি ছক্কার . ক্রয়মূল্য = 50 × 100 ÷ 4 = 1250 টাকা\nযাচাই: 1250-এর 8% = 100, 12% = 150; পার্থক্য 50।\nউত্তর: 1250 টাকা"}, {"id": "sup-pre19-15", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "25 মিটার দৈর্ঘ্য ও 17 মিটার প্রস্থবিশিষ্ট একটি আয়তাকার বাগানের চারধারে 2 মিটার চওড়া একটি রাস্তা আছে। রাস্তাটির ক্ষেত্রফল হবে", "options": ["184 বর্গমিটার", "88 বর্গমিটার", "34 বর্গমিটার", "50 বর্গমিটার"], "answer": 0, "answer_source": "claude", "explain": "১. রাস্তাসহ দৈর্ঘ্য = 25 + 2×2 = 29 মি, প্রস্থ = 17 + 2×2 = 21 মি।\n২. রাস্তাসহ ক্ষেত্রফল = 29 × 21 = 609 বর্গমি।\n৩. বাগানের ক্ষেত্রফল = 25 × 17 = 425 বর্গমি।\n৪. রাস্তার ক্ষেত্রফল = 609 − 425 = 184 বর্গমি।\nউত্তর: 184 বর্গমিটার"}, {"id": "sup-pre19-16", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি ভগ্নাংশের লবের সঙ্গে 1 যোগ করলে ভগ্নাংশটি হয় 1/2 এবং হর থেকে 1 বিয়োগ করলে ভগ্নাংশটি হয় 1/3। ভগ্নাংশটি নির্ণয় করুন।", "options": ["1/5", "1/4", "1/3", "1/2"], "answer": 1, "answer_source": "claude", "explain": "১. ধরি ভগ্নাংশ x/y।\n২. (x+1)/y = 1/2 → y = 2x + 2\n৩. x/(y−1) = 1/3 → y − 1 = 3x → y = 3x + 1\n৪. 2x + 2 = 3x + 1 → x = 1, y = 4\nযাচাই: (1+1)/4 = 1/2, 1/(4−1) = 1/3।\nউত্তর: 1/4"}, {"id": "sup-pre19-17", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "ভারতের সংবিধানের প্রথম খসড়া তৈরি করেছিলেন", "options": ["জওহরলাল নেহরু", "ডঃ আম্বেদকর", "বি. এন. রাও", "খসড়া কমিটি"], "answer": 2, "answer_source": "claude", "explain": "সংবিধান সভার উপদেষ্টা বি. এন. রাও (B. N. Rau) ১৯৪৭ সালের অক্টোবরে সংবিধানের প্রথম খসড়া তৈরি করেন। পরে ডঃ আম্বেদকরের নেতৃত্বে খসড়া কমিটি সেটি পরীক্ষা করে চূড়ান্ত খসড়া দেয়।"}, {"id": "sup-pre19-18", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "পৃথিবীতে কোনটি সর্ববৃহৎ লবণাক্ত হ্রদ?", "options": ["সুপিরিয়র হ্রদ", "কাস্পিয়ান সাগর", "চিলকা হ্রদ", "উলার হ্রদ"], "answer": 1, "answer_source": "claude", "explain": "কাস্পিয়ান সাগর পৃথিবীর বৃহত্তম লবণাক্ত হ্রদ (আসলে বৃহত্তম হ্রদই)। সুপিরিয়র হ্রদ বৃহত্তম মিঠা জলের হ্রদ; চিলকা ভারতের বৃহত্তম উপহ্রদ।"}, {"id": "sup-pre19-19", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "'ভারত ছাড়ো' আন্দোলনের সময় ভাইসরয় ছিলেন", "options": ["লর্ড মাউন্টব্যাটেন", "ওয়াভেল", "উইলিংটন", "লিনলিথগো"], "answer": 3, "answer_source": "claude", "explain": "১৯৪২ সালের ভারত ছাড়ো আন্দোলনের সময় ভাইসরয় ছিলেন লর্ড লিনলিথগো। তিনি ১৯৩৬–১৯৪৩ পর্যন্ত ভাইসরয় ছিলেন।"}, {"id": "sup-pre19-20", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "একটি ঘনকের (cube) সব উপরিতল রঙিন। একে কেটে এমন ছোট ঘনক করা হল যাদের প্রতিটি বাহু মূল ঘনকের বাহুর 1/4। তবে শুধু একদিক রঙিন এমন ছোট ঘনকের সংখ্যা নির্ণয় করুন।", "options": ["60", "32", "24", "16"], "answer": 2, "answer_source": "claude", "explain": "১. প্রতিটি বাহু 4 ভাগে কাটা হল, তাই n = 4 (মোট 64টি ছোট ঘনক)।\n২. একদিক রঙিন ঘনক = 6 × (n − 2)² \n৩. = 6 × (4 − 2)² = 6 × 4 = 24\nউত্তর: 24"}, {"id": "sup-pre19-21", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "A ও B একসঙ্গে কোনো একটি কাজ 2 দিনে সম্পন্ন করে। আলাদাভাবে একা কাজ করলে A-এর যে সময় লাগে, তার চেয়ে B-এর 3 দিন বেশি সময় লাগে। B কতদিনে কাজটি একাকী সম্পন্ন করতে পারবে?", "options": ["3 দিনে", "4 দিনে", "5 দিনে", "6 দিনে"], "answer": 3, "answer_source": "claude", "explain": "১. ধরি A একা x দিনে করে, তাহলে B করে (x + 3) দিনে।\n২. একদিনে দুজনে করে 1/x + 1/(x+3) = 1/2\n৩. 2(2x + 3) = x(x + 3) → x² − x − 6 = 0 → (x − 3)(x + 2) = 0 → x = 3\n৪. B-এর সময় = 3 + 3 = 6 দিন।\nযাচাই: 1/3 + 1/6 = 1/2।\nউত্তর: 6 দিনে"}, {"id": "sup-pre19-22", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "ভেরিয়েবল এনার্জি সাইক্লোট্রন সেন্টার অবস্থিত", "options": ["কোলকাতা-য়", "মুম্বাই-তে", "দিল্লী-তে", "হায়দ্রাবাদ-এ"], "answer": 0, "answer_source": "claude", "explain": "ভেরিয়েবল এনার্জি সাইক্লোট্রন সেন্টার (VECC) কলকাতার সল্টলেকে অবস্থিত। এটি পরমাণু শক্তি দপ্তরের অধীন।"}, {"id": "sup-pre19-23", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "ভারতের কোন রেলওয়েকে বিশ্বস্মারকরূপে (ওয়ার্ল্ড হেরিটেজ) ঘোষণা করা হয়েছে?", "options": ["তাজ এক্সপ্রেস", "দিল্লী-গৌহাটি রাজধানী এক্সপ্ e", "explain": "১. 9545-এর কাছাকাছি পূর্ণবর্গ খুঁজি: 97² = 9409, 98² = 9604 (যা 9545-এর বেশি)।\n২. তাই 9545-এর থেকে ছোট সবচেয়ে বড় পূর্ণবর্গ 9409।\n৩. বিয়োগ করতে হবে 9545 − 9409 = 136\nউত্তর: 136"}, {"id": "sup-pre19-30", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "রাতের আকাশে কোন গ্রহকে সবচেয়ে উজ্জ্বল দেখায়?", "options": ["বৃহস্পতি", "শনি", "শুক্র", "মঙ্গল"], "answer": 2, "answer_source": "claude", "explain": "শুক্র রাতের আকাশে সবচেয়ে উজ্জ্বল গ্রহ। একে 'সন্ধ্যাতারা' ও 'শুকতারা' বলা হয়।"}, {"id": "sup-pre19-31", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "যদি p জন লোক p দিনে p সংখ্যক কাজ করতে পারে, তবে q জন লোকের q সংখ্যক কাজ করতে যতদিন লাগবে, তা নির্ণয় করুন।", "options": ["p দিন", "q দিন", "p/q দিন", "q/p দিন"], "answer": 0, "answer_source": "claude", "explain": "১. p জন লোক p দিনে p টি কাজ করে।\n২. তাহলে p জন লোক p দিনে 1 জন পিছু 1টি কাজ করে, অর্থাৎ 1 জন লোক 1টি কাজ করতে p দিন লাগে।\n৩. q জন লোক q টি কাজ করবে — প্রত্যেকে 1টি করে, তাই সময় লাগবে p দিন।\nউত্তর: p দিন"}, {"id": "sup-pre19-32", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "কোনো চৌবাচ্চার সংযোগকারী দুটি নল পৃথকভাবে চৌবাচ্চাটিকে যথাক্রমে 6 ঘণ্টা ও 12 ঘণ্টায় জলপূর্ণ করে। ওই দুটি নল একসঙ্গে কতক্ষণে চৌবাচ্চাটি পূর্ণ করবে?", "options": ["3 ঘণ্টায়", "4 ঘণ্টায়", "5 ঘণ্টায়", "11/2 ঘণ্টায়"], "answer": 1, "answer_source": "claude", "explain": "১. প্রথম নল 1 ঘণ্টায় ভরে 1/6 অংশ, দ্বিতীয় নল 1/12 অংশ।\n২. একসঙ্গে 1 ঘণ্টায় = 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4 অংশ।\n৩. পুরো চৌবাচ্চা ভরতে সময় = 4 ঘণ্টা।\nউত্তর: 4 ঘণ্টায়"}, {"id": "sup-pre19-33", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি বিশেষ ব্লেন্ডের চা-এ আসাম ও দার্জিলিং চা-এর অনুপাত 3 : 4। তাহলে যে মিশ্র চা-এ 1 কিগ্রা আসাম চা থাকে, সেই মিশ্র চা-এর পরিমাণ নির্ণয় করুন।", "options": ["1.2 কিগ্রা", "12 কিগ্রা", "1 কিগ্রা", "7/3 কিগ্রা"], "answer": 3, "answer_source": "claude", "explain": "১. অনুপাত 3 : 4 মানে মোট 7 ভাগের 3 ভাগ আসাম চা।\n২. 3 ভাগ = 1 কিগ্রা হলে 1 ভাগ = 1/3 কিগ্রা িনিট।\nউত্তর: 1 মিনিট"}, {"id": "sup-pre19-48", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "কোনো মূলধনের 2 বছরের সরল সুদ ও চক্রবৃদ্ধি সুদ যথাক্রমে 1440 টাকা ও 1483.20 টাকা। সুদের হার নির্ণয় করুন।", "options": ["6%", "5%", "6.5%", "9%"], "answer": 0, "answer_source": "claude", "explain": "১. 1 বছরের সরল সুদ = 1440 ÷ 2 = 720 টাকা।\n২. চক্রবৃদ্ধি − সরল = 1483.20 − 1440 = 43.20 টাকা। এটি প্রথম বছরের সুদ 720 টাকার উপর দ্বিতীয় বছরের সুদ।\n৩. হার = 43.20 × 100 ÷ 720 = 6%\nযাচাই: মূলধন = 720 × 100 ÷ 6 = 12000; চক্রবৃদ্ধি সুদ = 12000 × (1.06² − 1) = 1483.20।\nউত্তর: 6%"}, {"id": "sup-pre19-49", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "'প্রতি ঘণ্টায় 20 কিমি' এবং 'প্রতি সেকেন্ডে 20 মিটার' -এদের অনুপাত নির্ণয় করুন।", "options": ["7:9", "5:7", "5:18", "1:1"], "answer": 2, "answer_source": "claude", "explain": "১. কিমি/ঘণ্টা থেকে মিটার/সেকেন্ড করতে 5/18 দিয়ে গুণ করি।\n২. 20 কিমি/ঘণ্টা = 20 × 5/18 = 50/9 মি/সে।\n৩. অনুপাত = 50/9 : 20 = 50 : 180 = 5 : 18\nউত্তর: 5:18"}, {"id": "sup-pre19-51", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "একটি হ্রদের জল যদি অন্য তরল পদার্থের মতো ব্যবহার করে তাহলে চরম ঠান্ডায় সেই জল বরফ হবে", "options": ["ওপর থেকে নীচে", "নীচ থেকে ওপরে", "একই সাথে সম্পূর্ণ লেকের জল", "প্রথমে ওপর, নীচ, ধার এবং শেষে সম্পূর্ণ ভেতরের জল"], "answer": 1, "answer_source": "claude", "explain": "অন্য তরল ঠান্ডা হলে ভারী হয়ে নিচে নামে এবং কঠিন অবস্থাও তরলের চেয়ে ভারী, তাই নিচ থেকে জমতে শুরু করত। জলের ব্যতিক্রমী প্রসারণের জন্য (৪°C-এ সর্বাধিক ঘনত্ব, বরফ হালকা) আসলে হ্রদ ওপর থেকে জমে।"}, {"id": "sup-pre19-52", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "'এস এল ভি' (SLV)-এর পূর্ণ রূপটি হল", "options": ["স্ট্যাটিউটরি লিকুইডিটি ভেরিয়েবল", "স্টেট লেভেল ভ্যারিয়েশন", "স্যাটেলাইট লঞ্চ ভেহিক্‌ল", "সী-লঞ্চ ভেহিক্‌ল"], "answer": 2, "answer_source": "claude", "explain": "SLV মানে Satellite Launch Vehicle — উপগ্রহ উৎক্ষেপণ যান। ভারতের প্রথম SLV-3 ১৯৮০ সালে রোহিণী উপগ্রহ পাঠায়। (SLR = Statutory Liquidity Ratio, গুলিয per": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "অপ্রযোজ্য (বেমানান) শব্দটি নির্বাচন করো:", "options": ["ম্যাকেঞ্জি (Mackenzie)", "ইয়েনিসেই (Yenisei)", "মিশিগান (Michigan)", "দানিউব (Danube)"], "answer": 2, "answer_source": "claude", "explain": "ম্যাকেঞ্জি, ইয়েনিসেই ও দানিউব — তিনটিই নদী। মিশিগান একটি হ্রদ (উত্তর আমেরিকার পঞ্চ হ্রদের একটি)।"}, {"id": "sup-pre19-63", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "'রয়টার' (Reuters) সংবাদ সংস্থার কেন্দ্রীয় কার্যালয় হল", "options": ["নিউ ইয়র্ক", "ওয়াশিংটন", "লন্ডন", "বার্মিংহাম"], "answer": 2, "answer_source": "claude", "explain": "রয়টার্স সংবাদ সংস্থার সদর দপ্তর লন্ডনে (ইংল্যান্ড)। ভারতের সংবাদ সংস্থা PTI-এর সদর দপ্তর নয়াদিল্লিতে।"}, {"id": "sup-pre19-65", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "নীচের উক্তিগুলির কোনটি সত্য?", "options": ["√7 + √2 > √6 + √3", "√11 + √3 > √8 + √6", "√5 + √3 > √6 + √2", "√15 + √5 > √14 + √6"], "answer": 2, "answer_source": "claude", "explain": "১. প্রতিটি জোড়ায় দুই পাশের সংখ্যার যোগফল সমান (যেমন 5+3 = 6+2 = 8)।\n২. নিয়ম: যোগফল সমান হলে যে জোড়ার সংখ্যা দুটি কাছাকাছি, তার বর্গমূলের যোগ বড়।\n৩. 5 ও 3 কাছাকাছি (পার্থক্য 2), 6 ও 2 দূরে (পার্থক্য 4)। তাই √5+√3 বড়।\n৪. হিসেব: √5+√3 ≈ 2.236+1.732 = 3.968; √6+√2 ≈ 2.449+1.414 = 3.864। 3.968 > 3.864 ✓\n৫. অন্যগুলিতে বাম দিক ছোট (যেমন √7+√2 ≈ 4.060 < √6+√3 ≈ 4.182)।\nউত্তর: √5 + √3 > √6 + √2"}, {"id": "sup-pre19-66", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি পরীক্ষায় একটি ছাত্র প্রতিটি সঠিক উত্তরের জন্য 4 নম্বর পায় এবং প্রতিটি ভুল উত্তরের জন্য 1 নম্বর কাটা যায়। যদি সে মোট 60টি প্রশ্নের উত্তর দেয় এবং 130 নম্বর পায়, তাহলে সে কতগুলি প্রশ্নের সঠিক উত্তর দিয়েছিল?", "options": ["35", "38", "40", "42"], "answer": 1, "answer_source": "claude", "explain": "১. ধরি সঠিক = x, তাহলে ভুল = 60 − x।\n২. নম্বর: 4x − (60 − x) = 130।\n৩. 4x − 60 + x = 130 → 5x = 190।\n৪. x = 190 ÷ 5 = 38।\nযাচাই: 38×4 = 152, ভুল 22, 152 − 22 = 130 ✓\nউত্তর: 38"}, {"id": "sup-pre19-67", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "লুপ্ত সংখ্যাটি কত? (প্রতিটি চিত্রে চার কোণে চারটি সংখ্যা ও মাঝে একটি সংখ্যা)\nচিত্র ১: 56, 22, 15, 8 — মাঝে 41\nচিত্র ২: 46, 10, 9, 6 — মাঝে 39\nচিত্র ৩: 34, 14, 11, 6 — মাঝে ?", "options": ["12", "25", "48", "52"], "answer": 1, "answer_source": "claude", "explain": "১. নিয়ম: (উপর-বাম + নীচ-বাম) − (উপর-ডান + নীচ-ডান)।\n২. চিত্র ১: (56+15) − (22+8) = 71 − 30 = 41 ✓\n৩. চিত্র ২: (46+9) − (10+6) = 55 − 16 = 39 ✓\n৪. চিত্র ৩: (34+11) − (14+6) = 45 − 20 = 25।\nউত্তর: 25"}, {"id": "sup-pre19-68", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "ভারতে আসার সমুদ্রপথ কে প্রথম আবিষ্কার করেন?", "options": ["ভাস্কো-ডা-গামা", "আমুন্ডসেন", "ক্যাপ্টেন কুক", "কলম্বাস"], "answer": 0, "answer_source": "claude", "explain": "পর্তুগিজ নাবিক ভাস্কো-ডা-গামা ১৪৯৮ সালে কেরলের কালিকটে পৌঁছে ইউরোপ থেকে ভারতের সমুদ্রপথ আবিষ্কার করেন। কলম্বাস ভারত খুঁজতে গিয়ে আমেরিকায় পৌঁছান (১৪৯২)।"}, {"id": "sup-pre19-69", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "8 জন ছাত্র A, B, C, D, E, F, G এবং H গাড়ি চালানোর প্রতিযোগিতার পরিকল্পনা করল। মাত্র 2টি গাড়ি আছে এবং শর্তগুলি এরকম:\n(i) একটি গাড়িতে সবচেয়ে বেশি 5 জন এবং কমপক্ষে 4 জন বসতে পারে।\n(ii) A সেই গাড়িতে বসবে যে গাড়িতে D বসে আছে, কিন্তু H সেই গাড়িতে নেই।\n(iii) B এবং C সেই গাড়িতে বসবে না যে গাড়িতে D বসে আছে।\n(iv) F বসবে সেই গাড়িতে যেখানে কেবল 4 জন বসবে, A এবং E-র সঙ্গে, কিন্তু অবশ্যই G-র সঙ্গে নয়।\nযদি H এবং G একই গাড়িতে বসে থাকে, অপর দু'জন কোন কোন ছাত্র ওই গাড়িতে বসে আছে?", "options": ["B এবং C", "C এবং D", "B এবং D", "E এবং B"], "answer": 0, "answer_source": "claude", "explain": "F, A, E একসঙ্গে 4 জনের গাড়িতে; A-র সঙ্গে D থাকে, তাই প্রথম গাড়ি = A, D, E, F। বাকি B, C, G, H দ্বিতীয় গাড়িতে — তাই H ও G-র সঙ্গে আছে B এবং C।"}, {"id": "sup-pre19-70", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি দেওয়াল ঘড়িতে 6টার ঘণ্টা বাজতে 3 সেকেন্ড সময় লাগে। ওই ঘড়িতে 9টার ঘণ্টা বাজতে কত সময় লাগবে, তা নির্ণয় করুন।", "options": ["6 সেকেন্ড", "5.8 সেকেন্ড", "5 সেকেন্ড", "4.8 সেকেন্ড"], "answer": 3, "answer_source": "claude", "explain": "১. 6টি ঘণ্টার মধ্যে ফাঁক = 6 − 1 = 5টি।\n২. প্রতিটি ফাঁক = 3 ÷ 5 = 0.6 সেকেন্ড।\n৩. 9টি ঘণ্টার মধ্যে ফাঁক = 9 − 1 = 8টি।\n৪. সময় = 8 × 0.6 = 4.8 সেকেন্ড।\nউত্তর: 4.8 সেকেন্ড"}, {"id": "sup-pre19-71", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "সরল করুন: 3√7/(√2+√5) − 5√5/(√2+√7) + √8/(√5+√7)", "options": ["0", "2√2", "3√5", "√7"], "answer": 0, "answer_source": "claude", "explain": "১. হরকে মূলদ করি (উপর-নীচে উল্টো চিহ্নের রাশি দিয়ে গুণ)।\n২. 3√7/(√5+√2) = 3√7(√5−√2)/(5−2) = √7(√5−√2) = √35 − √14।\n৩. 5√5/(√7+√2) = 5√5(√7−√2)/(7−2) = √5(√7−√2) = √35 − √10।\n৪. √8/(√7+√5) = √8(√7−√5)/(7−5) = (√8/2)(√7−√5) = √2(√7−√5) = √14 − √10।\n৫. মোট = (√35 − √14) − (√35 − √10) + (√14 − √10) = 0।\nউত্তর: 0"}, {"id": "sup-pre19-72", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "দুটি সংখ্যার অনুপাত 5 : 7 এবং তাদের ল.সা.গু. 385। সংখ্যাদুটির গ.সা.গু. কত হবে, তা নির্ণয় করুন।", "options": ["1", "5", "7", "11"], "answer": 3, "answer_source": "claude", "explain": "১. ধরি সংখ্যা দুটি 5k ও 7k (k = গ.সা.গু.)।\n২. ল.সা.গু. = 5 × 7 × k = 35k।\n৩. 35k = 385 → k = 385 ÷ 35 = 11।\n৪. সংখ্যা দুটি 55 ও 77, গ.সা.গু. = 11।\nউত্তর: 11"}, {"id": "sup-pre19-73", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "কোন ভাইসরয়ের আমলে বিশ্ববিদ্যালয় আইন (Universities Act) তৈরি হয়েছিল?", "options": ["ক্যানিং", "কার্জন", "এলগিন", "রীডিং"], "answer": 1, "answer_source": "claude", "explain": "ভারতীয় বিশ্ববিদ্যালয় আইন ১৯০৪ সালে লর্ড কার্জনের আমলে পাস হয়। কার্জনের আমলেই বঙ্গভঙ্গ (১৯০৫) হয়। (১৮৫৭ সালে ক্যানিংয়ের আমলে কলকাতা, বোম্বাই, মাদ্রাজ বিশ্ববিদ্যালয় স্থাপিত হয়।)"}, {"id": "sup-pre19-74", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "A ও B দুটি স্থানের দূরত্ব 25 কিমি। সায়ক সকাল 6টায় A থেকে 5 কিমি/ঘণ্টা বেগে হেঁটে B-এর উদ্দেশে রওনা হল। প্রতি 5 কিমি হাঁটার পর সে 5 মিনিট করে বিশ্রাম নেয়। সায়ক কখন B-তে পৌঁছাবে?", "options": ["বেলা 11টায়", "বেলা 11টা 10 মিনিটে", "বেলা 11টা 20 মিনিটে", "বেলা 11টা 25 মিনিটে"], "answer": 2, "answer_source": "claude", "explain": "১. হাঁটার সময় = 25 ÷ 5 = 5 ঘণ্টা।\n২. বিশ্রাম হয় 5, 10, 15, 20 কিমি পরে = 4 বার (25 কিমিতে পৌঁছে গেলে আর বিশ্রাম লাগে না)।\n৩. মোট বিশ্রাম = 4 × 5 = 20 মিনিট।\n৪. মোট সময় = 5 ঘণ্টা 20 মিনিট; সকাল 6টা + 5 ঘণ্টা 20 মিনিট = বেলা 11টা 20 মিনিট।\nউত্তর: বেলা 11টা 20 মিনিটে"}, {"id": "sup-pre19-75", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি সংখ্যাকে 5279421 দ্বারা ভাগ করলে 637 ভাগশেষ থাকে। সেই সংখ্যাকে 7 দ্বারা ভাগ করলে কত ভাগশেষ থাকবে?", "options": ["5", "3", "1", "0"], "answer": 3, "answer_source": "claude", "explain": "১. সংখ্যা = 5279421 × ভাগফল + 637।\n২. 5279421 ÷ 7 = 754203, ভাগশেষ 0 (অর্থাৎ 7 দ্বারা বিভাজ্য)।\n৩. 637 ÷ 7 = 91, ভাগশেষ 0।\n৪. তাই পুরো সংখ্যাটিও 7 দ্বারা বিভাজ্য, ভাগশেষ 0।\nউত্তর: 0"}, {"id": "sup-pre19-76", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি বর্গক্ষেত্র এবং একটি বৃত্তের ক্ষেত্রফল সমান হলে তাদের পরিসীমার তুলনা করুন (বর্গক্ষেত্র : বৃত্ত)।", "options": ["2 : √π", "π : 2", "1 : 1", "π : √2"], "answer": 0, "answer_source": "claude", "explain": "১. বর্গের বাহু a, বৃত্তের ব্যাসার্ধ r। ক্ষেত্রফল সমান: a² = πr², তাই a = r√π।\n২. বর্গের পরিসীমা = 4a = 4r√π।\n৩. বৃত্তের পরিধি = 2πr।\n৪. অনুপাত = 4r√π : 2πr = 2√π : π = 2 : √π (দুই পাশ √π দিয়ে ভাগ করে)।\nউত্তর: 2 : √π"}, {"id": "sup-pre19-77", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "একটি ঘরের দৈর্ঘ্য, প্রস্থ ও উচ্চতা যথাক্রমে 8′, 6′ ও 2√11′। এই ঘরের মধ্যে সবচেয়ে লম্বা যে লোহার রড রাখা যাবে, তার দৈর্ঘ্য কত হবে?", "options": ["12√3′", "11√3′", "12′", "11′"], "answer": 2, "answer_source": "claude", "explain": "১. সবচেয়ে লম্বা রড = ঘরের কর্ণ = √(দৈর্ঘ্য² + প্রস্থ² + উচ্চতা²)।\n২. = √(8² + 6² + (2√11)²) = √(64 + 36 + 44)।\n৩. = √144 = 12।\nউত্তর: 12 ফুট"}, {"id": "sup-pre19-78", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "A কোনো কাজের 7/10 অংশ 14 দিনে করে। তারপর B-এর সাহায্য নিয়ে আরও 2 দিনে অবশিষ্ট কাজটি স  গুণ।\n(iii) C-এর ওজন D-এর ওজনের অর্ধেক।\n(iv) D-এর ওজন E-এর ওজনের অর্ধেক।\n(v) E-এর ওজন A-এর কম কিন্তু C-এর চেয়ে বেশি।\nনিম্নলিখিতগুলির মধ্যে কোনটি ওজনে সবচেয়ে হালকা?", "options": ["A", "B", "C", "D"], "answer": 2, "answer_source": "claude", "explain": "১. ধরি C = 2 কেজি।\n২. B = 4½ × 2 = 9, A = 2 × 9 = 18, D = 2 × 2 = 4, E = 2 × 4 = 8।\n৩. ক্রম: A(18) > B(9) > E(8) > D(4) > C(2)।\nউত্তর: C সবচেয়ে হালকা"}, {"id": "sup-pre19-90", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "দুটি ক্রমিক যুগ্ম সংখ্যার বর্গের সমষ্টি 5620। সংখ্যাদুটির যোগফল হবে", "options": ["100", "102", "104", "106"], "answer": 3, "answer_source": "claude", "explain": "১. ধরি সংখ্যা দুটি x ও x + 2।\n২. x² + (x + 2)² = 5620 → 2x² + 4x + 4 = 5620 → x² + 2x − 2808 = 0।\n৩. (x − 52)(x + 54) = 0 → x = 52।\n৪. সংখ্যা দুটি 52 ও 54; যাচাই: 52² + 54² = 2704 + 2916 = 5620 ✓\n৫. যোগফল = 52 + 54 = 106।\nউত্তর: 106"}, {"id": "sup-pre19-91", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "reasoning", "q": "কুনাল উত্তরমুখে 10 কিমি হাঁটে। সেখান থেকে সে 6 কিমি দক্ষিণদিকে হাঁটে। তারপর সে 3 কিমি পূর্বদিকে হাঁটে। এখন সে যাত্রা শুরুর বিন্দু থেকে কত দূরে এবং কোন অভিমুখে রয়েছে?", "options": ["5 কিমি পশ্চিমে", "7 কিমি পশ্চিমে", "7 কিমি পূর্বে", "5 কিমি উত্তর-পূর্বে"], "answer": 3, "answer_source": "claude", "explain": "১. উত্তরে 10, দক্ষিণে 6 → শুরু থেকে 4 কিমি উত্তরে।\n২. তারপর 3 কিমি পূর্বে।\n৩. দূরত্ব = √(4² + 3²) = √(16 + 9) = √25 = 5 কিমি।\n৪. সে উত্তর ও পূর্ব দুদিকেই সরেছে, তাই উত্তর-পূর্ব দিকে।\nউত্তর: 5 কিমি উত্তর-পূর্বে"}, {"id": "sup-pre19-92", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "কংগ্রেস সমাজতান্ত্রিক দল (CSP) আনুষ্ঠানিকভাবে মে মাসের যে সম্মেলনে প্রতিষ্ঠিত হয়েছিল তা হয়েছিল", "options": ["বাংলায়", "বোম্বেতে", "বিহারে", "আসামে"], "answer": 2, "answer_source": "claude", "explain": "কংগ্রেস সোশ্যালিস্ট পার্টি ১৯৩৪ সালের মে মাসে বিহারের পাটনায় আচার্য নরেন্দ্র দেবের সভাপতিত্বে প্রতিষ্ঠিত হয়। জয়প্রকাশ নারায়ণ ছিলেন অন্যতম প্রধান প্রতিষ্ঠাতা।"}, {"id": "sup-pre19-93", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "health", "q": "ব্যাকটেরিয়ার আবিষ্কারক কে?", "options": ["উইলিয়াম হার্ভে", "লুই পাস্তুর", "এডওয়ার্ড জেনার", "লিউয়েনহুক"], "answer": 3, "answer_source": "claude", "explain": "অ্যান্টনি ভ্যান লিউয়েনহুক (১৬৭৬) নিজের তৈরি অণুবীক্ষণ যন্ত্রে প্রথম ব্যাকটেরিয়া দেখেন — তাঁকে 'অণুজীববিদ্যার জনক' বলা হয়। হার্ভে রক্তসঞ্চালন, জেনার গুটিবসন্তের টিকা আবিষ্কার করেন।"}, {"id": "sup-pre19-94", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "math", "q": "A : B = 3 : 4 এবং B : C = 6 : 5 হলে A : C-এর মান নির্ণয় করুন।", "options": ["3 : 4", "6 : 5", "9 : 10", "1 : 2"], "answer": 2, "answer_source": "claude", "explain": "১. B-কে দুই অনুপাতে সমান করি: 4 ও 6-এর ল.সা.গু. 12।\n২. A : B = 3 : 4 = 9 : 12; B : C = 6 : 5 = 12 : 10।\n৩. তাই A : B : C = 9 : 12 : 10, অর্থাৎ A : C = 9 : 10।\nউত্তর: 9 : 10"}, {"id": "sup-pre19-95", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "1929 সালে কংগ্রেস দলের লাহোর অধিবেশন কার সভাপতিত্বে সংঘটিত হয়েছিল?", "options": ["বাল গঙ্গাধর তিলক", "গোপাল কৃষ্ণ গোখলে", "মোতিলাল নেহেরু", "জওহরলাল নেহেরু"], "answer": 3, "answer_source": "claude", "explain": "১৯২৯ সালের লাহোর অধিবেশনে সভাপতি ছিলেন জওহরলাল নেহেরু; এখানেই 'পূর্ণ স্বরাজ' প্রস্তাব গৃহীত হয় এবং ২৬ জানুয়ারি ১৯৩০ স্বাধীনতা দিবস পালিত হয়। আগের বছর (১৯২৮, কলকাতা) সভাপতি ছিলেন মোতিলাল নেহেরু।"}, {"id": "sup-pre19-96", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "'সাঁচী' বৌদ্ধ স্মৃতিসৌধগুলি ভারতের কোন্‌ রাজ্যে রয়েছে?", "options": ["মধ্যপ্রদেশ", "মহারাষ্ট্র", "উত্তরপ্রদেশ", "ওড়িশা"], "answer": 0, "answer_source": "claude", "explain": "সাঁচী স্তূপ মধ্যপ্রদেশের রাইসেন জেলায়, সম্রাট অশোক এটি নির্মাণ শুরু করেন। এটি ইউনেস্কো বিশ্ব ঐতিহ্য স্থান।"}, {"id": "sup-pre19-97", "paper": "সুপারভাইজার প্রিলি ২০১৯", "subject": "gk", "q": "পশ্চিমবঙ্গের কোন নদী 'বাংলার দুঃখ' বলে পরিচিত?", "options": ["কংসাবতী", "গঙ্গা", "দামোদর", "সুবর্ণরেখা"], "answer": 2, "answer_source": "claude", "explain": "বারবার বন্যার জন্য দামোদর নদীকে 'বাংলার দুঃখ' বলা হত। বন্যা নি ": "health", "q": "স্তন্যদানের সময় দুধ নেমে আসা (let-down reflex) কোন হরমোন নিয়ন্ত্রণ করে?", "options": ["ইস্ট্রোজেন", "অক্সিটোসিন", "প্রোজেস্টেরন", "প্রোল্যাকটিন"], "answer": 1, "answer_source": "paper", "explain": "অক্সিটোসিন হরমোন স্তন থেকে দুধ বের করে আনে (let-down)। মনে রাখুন: প্রোল্যাকটিন দুধ তৈরি করে, অক্সিটোসিন দুধ বের করে।"}, {"id": "sup13-4", "paper": "সুপারভাইজার ২০১৩", "subject": "health", "q": "নিচের কোন অবস্থায় বেশি আঁশযুক্ত (high residue / high fibre) খাদ্য দরকার?", "options": ["কোলাইটিস (Colitis)", "টাইফয়েড জ্বর", "কোষ্ঠকাঠিন্য (Constipation)", "ডায়রিয়া"], "answer": 2, "answer_source": "claude", "explain": "কোষ্ঠকাঠিন্যে বেশি আঁশযুক্ত খাবার (শাকসবজি, ফল, গোটা শস্য) মল নরম করে। টাইফয়েড, কোলাইটিস ও ডায়রিয়ায় উল্টে কম আঁশযুক্ত (low residue) খাবার দেওয়া হয়।"}, {"id": "sup13-5", "paper": "সুপারভাইজার ২০১৩", "subject": "health", "q": "খাদ্যে সোডিয়ামের অভাবে কোন অবস্থা হয়?", "options": ["হাইপোক্যালেমিয়া (Hypokalemia)", "হাইপোন্যাট্রেমিয়া (Hyponatremia)", "গ্লসাইটিস (Glossitis)", "নিউরাইটিস (Neuritis)"], "answer": 1, "answer_source": "paper", "explain": "রক্তে সোডিয়াম কমে যাওয়াকে হাইপোন্যাট্রেমিয়া বলে (Natrium = সোডিয়াম)। পটাশিয়াম কমলে হয় হাইপোক্যালেমিয়া (Kalium = পটাশিয়াম)।"}, {"id": "sup13-6", "paper": "সুপারভাইজার ২০১৩", "subject": "gk", "q": "ICDS প্রকল্প কোন সালে চালু হয়েছিল?", "options": ["১৯৭৫", "১৯৭২", "১৯৬৭", "১৯৭০"], "answer": 0, "answer_source": "paper", "explain": "ICDS (সুসংহত শিশু বিকাশ সেবা প্রকল্প) চালু হয় ২ অক্টোবর ১৯৭৫ সালে। প্রথমে ৩৩টি ব্লকে শুরু হয়েছিল।"}, {"id": "sup13-7", "paper": "সুপারভাইজার ২০১৩", "subject": "health", "q": "সম্প্রসারণ শিক্ষায় (extension education) জ্ঞান দেওয়ার জন্য ব্যবহৃত বড় আকারের ছবিকে কী বলে?", "options": ["ফ্ল্যানেল বোর্ড", "পুতুল (Puppets)", "পোস্টার (Posters)", "ফ্ল্যাশ কার্ড"], "answer": 2, "answer_source": "paper", "explain": "পোস্টার হল বড় আকারের ছবি যা দূর থেকে দেখে একটি বার্তা বোঝা যায়। ফ্ল্যাশ কার্ড ছোট কার্ড, একটার পর একটা দেখিয়ে গল্প বলা হয়।"}, {"id": "sup13-8", "paper": "সুপারভাইজার ২০১৩", "subject": "gk", "q": "জওহর রোজগার যোজনার (JRY) মূল লক্ষ্য কী?", "options": ["সকলের জন্য স্বাস্থ্য", "কৃষির উন্নতি", "গ্রামীণ পরিকাঠামোর উন্নয়ন", "বেকারত্ব কমানো"], "answer": 3, "answer_source": "claude", "explain": "জওহর রোজগার যোজনা (১৯৮৯)-র প্রধান লক্ষ্য ছিল গ্রামের বেকার ও অর্ধ-বেকার মানুষের জন্য বাড়তি কাজের সুযোগ তৈরি করা। গ্রামীণ পরিকাঠামো তৈরি ছিল দ্বিতীয় (গৌণ) লক্ষ্য।"}, {"id": "sup13-9", "paper": "সুপারভাইজার ২০১৩", "subject": "gk", "q": "কর্মসূচি তৈরির কোন ধাপে কর্মসূচিটি আসলে কাজে পরিণত (মঞ্চস্থ) করা হয়?", "options": ["পরিকল্পনা (Planning)", "বাস্তবায়ন (Implementation)", "ফলো-আপ বিশ্লেষণ", "সিদ্ধান্ত গ্রহণ"], "answer": 1, "answer_source": "paper", "explain": "বাস্তবায়ন (Implementation) ধাপে পরিকল্পনা অনুযায়ী কাজটি মাঠে করা হয়। ক্রম: পরিকল্পনা → বাস্তবায়ন → মূল্যায়ন/ফলো-আপ।"}, {"id": "sup13-10", "paper": "সুপারভাইজার ২০১৩", "subject": "gk", "q": "স্কুলে না-যাওয়া শিশু বা স্কুলছুটদের (drop-outs) বিভিন্ন শিক্ষার প্রয়োজন মেটাতে কোন শিক্ষা?", "options": ["প্রথাগত শিক্ষা (Formal)", "শ্রেণিকক্ষ শিক্ষা", "প্রথা-বহির্ভূত শিক্ষা (Non-formal)", "বয়স্ক শিক্ষা"], "answer": 2, "answer_source": "paper", "explain": "প্রথা-বহির্ভূত (non-formal) শিক্ষা স্কুলের নিয়মের বাইরে, স্কুলছুট ও স্কুলে না-যাওয়া শিশুদের জন্য নমনীয়ভাবে দেওয়া হয়।"}, {"id": "sup13-11", "paper": "সুপারভাইজার ২০১৩", "subject": "health", "q": "ভৌত কারণে (আলো, তাপ, বাতাস) তেল-চর্বিতে খারাপ স্বাদ ও গন্ধ তৈরি হওয়াকে কী বলে?", "options": ["পলিমারাইজেশন", "উইন্টারাইজেশন", "হাইড্রোজেনেশন", "র‍্যান্সিডিটি (Rancidity) বা বিকৃত হওয়া"], "answer": 3, "answer_source": "paper", "explain": "তেল বা ঘি অনেকদিন রাখলে বা আলো-বাতাসে থাকলে বাসি গন্ধ হয় — একে র‍্যান্সিডিটি বলে। বায়ুরোধী, অন্ধকার পাত্রে রাখলে এটি কমে।"}, {"id": "sup13-12", "paper": "সুপারভাইজার ২০১৩", "subject": "health", "q": "গমের আটার মণ্ড (dough) রবারের মতো স্থিতিস্থাপক হয় কোন উপাদানের জন্য?", "options": ["গ্লুটেন (Gluten)", "সেলুলোজ", "লাইসিন", "অ্যামাইলেজ"], "answer": 0, "answer_source": "paper", "explain": "গমের er": "সুপারভাইজার ২০১৭", "subject": "math", "q": "৩টা ৫০ মিনিটে ঘড়ির ঘণ্টার কাঁটা ও মিনিটের কাঁটার মধ্যে (ছোট) কোণ কত?", "options": ["১৮০°", "১৮৫°", "১৯০°", "১৭৫°"], "answer": 3, "answer_source": "claude", "explain": "১. সূত্র: কোণ = |৩০ × ঘণ্টা − ৫.৫ × মিনিট|।\n২. = |৩০ × ৩ − ৫.৫ × ৫০| = |৯০ − ২৭৫| = ১৮৫°।\n৩. ১৮৫° হল ১৮০°-এর বেশি (বড় দিকের কোণ)। দুই কাঁটার মধ্যে ছোট কোণ = ৩৬০° − ১৮৫° = ১৭৫°।\nউত্তর: ১৭৫°"}, {"id": "sup17-62", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "সিরিজের হারিয়ে যাওয়া পদটি বের করুন: VFB, ?, PHG, MIK, JJP", "options": ["TGD", "SGD", "SGE", "SGF"], "answer": 1, "answer_source": "paper", "explain": "১. প্রথম অক্ষর: V, ?, P, M, J — প্রতিবার ৩ ঘর পিছোচ্ছে, তাই V → S।\n২. দ্বিতীয় অক্ষর: F, ?, H, I, J — প্রতিবার ১ ঘর এগোচ্ছে, তাই G।\n৩. তৃতীয় অক্ষর: B(২), ?, G(৭), K(১১), P(১৬) — ব্যবধান +২, +৩, +৪, +৫, তাই B + ২ = D(৪)।\n৪. হারানো পদ = SGD।\nউত্তর: SGD"}, {"id": "sup17-63", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "একটি সংকেত ভাষায় BIOGRAPHY-কে লেখা হয় YIQBSHPJB। তাহলে MICROWAVE-কে কীভাবে লেখা হবে?", "options": ["EWBXPSDJM", "EJDSPXBWM", "NIESBXPRV", "NIVAWORCV"], "answer": 0, "answer_source": "paper", "explain": "১. BIOGRAPHY উল্টো করলে: Y H P A R G O I B।\n২. প্রথম ও শেষ অক্ষর (Y, B) একই থাকে; মাঝের অক্ষরগুলি ১ ঘর এগোয়: H→I, P→Q, A→B, R→S, G→H, O→P, I→J ⇒ YIQBSHPJB ✓।\n৩. MICROWAVE উল্টো: E V A W O R C I M।\n৪. প্রথম ও শেষ (E, M) একই; মাঝে: V→W, A→B, W→X, O→P, R→S, C→D, I→J।\n৫. ফল: EWBXPSDJM।\nউত্তর: EWBXPSDJM"}, {"id": "sup17-64", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "বেমানান শব্দটি বেছে নিন।", "options": ["পক্ষকাল (Fortnight)", "দশক (Decade)", "শতাব্দী (Century)", "দশ লক্ষ (Million)"], "answer": 3, "answer_source": "paper", "explain": "পক্ষকাল (১৫ দিন), দশক (১০ বছর) ও শতাব্দী (১০০ বছর) — সবই সময়ের পরিমাপ। 'Million' (দশ লক্ষ) একটি সংখ্যা, সময় নয়।"}, {"id": "sup17-65", "paper": "সুপারভাইজার ২০১৭", "subject": "english", "q": "নিচের সমার্থক শব্দজোড়াগুলির (synonyms) মধ্যে কোনটি ভুল?", "options": ["Revoke - Withdraw", "Abduct - Kidnap", "Ingenious - Foolish", "Solemn - Sacred"], "answer": 2, "answer_source": "paper", "explain": "Ingenious মানে বুদ্ধিদীপ্ত/উদ্ভাবনী — Foolish (বোকা) এর প্রায় বিপরীত। Revoke = প্রত্যাহার করা, Abduct = অপহরণ করা, Solemn = গম্ভীর/পবিত্র।"}, {"id": "sup17-66", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "COURT : JUSTICE — এই সম্পর্কের মতো একই সম্পর্ক কোন জোড়ায় আছে?", "options": ["HOSPITAL : DISEASE (হাসপাতাল : রোগ)", "SCHOOL : EDUCATION (বিদ্যালয় : শিক্ষা)", "VEHICLE : LICENSE (যানবাহন : লাইসেন্স)", "HOME : MONEY (বাড়ি : টাকা)"], "answer": 1, "answer_source": "paper", "explain": "আদালত ন্যায়বিচার দেয়, তেমনি বিদ্যালয় শিক্ষা দেয় — জায়গা : সেখানে যা দেওয়া হয়। হাসপাতাল রোগ দেয় না, সারায়।"}, {"id": "sup17-67", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "A, B, C, D, E, F — ছয়টি শিশু উত্তরমুখী হয়ে এক সারিতে বসে আছে। A ও E-এর মাঝে কেবল D বসে আছে। C কোনো প্রান্তে নেই। B, E-এর ঠিক ডানদিকে বসে। F ডান প্রান্তে নেই। C-এর ডানদিকে কতজন আছে?", "options": ["চারজন", "তিনজন", "দুজন", "একজন"], "answer": 0, "answer_source": "paper", "explain": "১. A ও E-এর মাঝে শুধু D, আর B ঠিক E-এর ডানে ⇒ ক্রম A D E B (E D A হলে B পড়বে E ও D-র মাঝে, যা নিয়মবিরুদ্ধ)।\n২. বাকি C ও F। C প্রান্তে নয়, F ডান প্রান্তে নয়।\n৩. একমাত্র সম্ভব সাজানো (বাঁ থেকে ডানে): F C A D E B।\n৪. C-এর ডানে আছে A, D, E, B = ৪ জন।\nউত্তর: চারজন"}, {"id": "sup17-68", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "বিবৃতি: সব ইঁদুর বিড়াল। সব বিড়াল খেলনা। কোনো খেলনা বাঘ নয়।\nসিদ্ধান্ত: I. কোনো বাঘ বিড়াল নয়। II. কোনো বাঘ ইঁদুর নয়। III. কিছু খেলনা বিড়াল। IV. কিছু খেলনা ইঁদুর।\nকোন সিদ্ধান্তগুলি যুক্তিসঙ্গতভাবে অনুসরণ করে?", "options": ["কোনোটিই নয়", "কেবল I ও II", "কেবল I ও IV", "সবকটি"], "answer": 3, "answer_source": "paper", "explain": "ইঁদুর ⊂ বিড়াল ⊂ খেলনা, আর খেলনা ও বাঘ সম্পূর্ণ আলাদা। তাই বাঘ বিড়ালও নয়, ইঁদুরও নয় (I, II ঠিক)। সব বিড়াল খেলনা হলে কিছু খেলনা বিড়াল (III), সব ইঁদুর খেলনা হলে কিছু খেলনা ইঁদুর (IV) — সবকটি ঠিক।"}, {"id": "sup17-70", "paper": "সুপারভাইজার ২০১৭", "subject": "reasoning", "q": "২০০৪ সালের ৫ জানুয়ারি সোমবার হলে, ২০০৪ সালের ১৪ এপ্রিল কী বার ছিল?", "options": ["সোমবার", "মঙ্গলবার", "বুধবার", "কোনোটিই নয়"], "answer": 2, "answer_source": "paper", "explain": "১. ২০০৪ অধিবর্ষ, তাই ফেব্রুয়ারি ২৯ দিনের।\n২. ৫ জানুয়ারির পর দিন গুনি: জানুয়ারি ২৬ + ফেব্রুয়ারি ২৯ + মার্চ ৩১ + এপ্রিল ১৪ = ১০০ দিন।\n৩. ১০০ ÷ ৭ = ১৪ সপ্তাহ, ভাগশেষ ২।\n৪. সোমবার + ২ দিন = বুধবার।\nউত্তর: বুধবার"}, {"id": "sup17-71", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "জনঘনত্ব অনুযায়ী রাজ্যগুলির সঠিক অধঃক্রম (বেশি থেকে কম) কোনটি?", "options": ["পশ্চিমবঙ্গ, বিহার, কেরালা, উত্তরপ্রদেশ", "বিহার, পশ্চিমবঙ্গ, কেরালা, উত্তরপ্রদেশ", "কেরালা, পশ্চিমবঙ্গ, বিহার, উত্তরপ্রদেশ", "উত্তরপ্রদেশ, বিহার, পশ্চিমবঙ্গ, কেরালা"], "answer": 1, "answer_source": "paper", "explain": "২০১১ জনগণনা অনুযায়ী জনঘনত্ব (প্রতি বর্গ কিমি): বিহার ১১০৬, পশ্চিমবঙ্গ ১০২৮, কেরালা ৮৬০, উত্তরপ্রদেশ ৮২৯। বিহার সবচেয়ে ঘন বসতিপূর্ণ রাজ্য, পশ্চিমবঙ্গ দ্বিতীয়।"}, {"id": "sup17-72", "paper": "সুপারভাইজার ২০১৭", "subject": "health", "q": "শিশুমৃত্যুর হার (Child Mortality Rate) কোন বয়সের আগে মারা যাওয়া শিশুদের হিসাব করে?", "options": ["প্রথম জন্মদিন", "দ্বিতীয় জন্মদিন", "পঞ্চম জন্মদিন", "দশম জন্মদিন"], "answer": 2, "answer_source": "paper", "explain": "Child Mortality Rate (Under-5) = ৫ বছর (পঞ্চম জন্মদিন) পূর্ণ হওয়ার আগে মৃত্যু। মনে রাখুন: Infant Mortality Rate (IMR) = ১ বছরের আগে মৃত্যু।"}, {"id": "sup17-73", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "উত্তর-পশ্চিম ভারতে শীতকালীন বৃষ্টি ঘটানো আর্দ্র বায়ুপুঞ্জ কোনটির অংশ?", "options": ["আয়ন বায়ু (Trade winds)", "ফিরতি মৌসুমি বায়ু", "স্থানীয় গোলযোগ", "পশ্চিমা বায়ু (Westerlies)"], "answer": 3, "answer_source": "paper", "explain": "শীতকালে ভূমধ্যসাগর থেকে আসা 'পশ্চিমী ঝঞ্ঝা' (Western Disturbance) পশ্চিমা বায়ুর সঙ্গে এসে পাঞ্জাব-হরিয়ানায় বৃষ্টি ঘটায় — রবিশস্য (গম) চাষে উপকারী।"}, {"id": "sup17-74", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "জাপানের সাহায্যে সম্পূর্ণ হওয়া পৈঠান (Paithan) জলবিদ্যুৎ প্রকল্প কোন নদীর উপর?", "options": ["গঙ্গা", "কাবেরী", "নর্মদা", "গোদাবরী"], "answer": 3, "answer_source": "paper", "explain": "মহারাষ্ট্রের পৈঠানে গোদাবরী নদীর উপর জয়কওয়াড়ি বাঁধ ও পৈঠান জলবিদ্যুৎ প্রকল্প অবস্থিত।"}, {"id": "sup17-75", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "'খাদার' (Khadar) কোন মাটিকে বলা হয়?", "options": ["দাক্ষিণাত্য মালভূমির কৃষ্ণ মাটি", "উত্তরের সমভূমির পুরোনো পলিমাটি", "উত্তরের সমভূমির নতুন পলিমাটি", "উপকূলীয় সমভূমির পলিমাটি"], "answer": 2, "answer_source": "paper", "explain": "খাদার = নদীর কাছের নতুন পলিমাটি (প্রতি বছর বন্যায় নতুন পলি জমে, খুব উর্বর)। ভাঙ্গর = পুরোনো পলিমাটি।"}, {"id": "sup17-76", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "গ্রাম ও ছোট শহরের শিক্ষিত বেকার যুবকদের স্বনিযুক্তির সুযোগ দিতে ১৯৯৩ সালে কোন প্রকল্প শুরু হয়?", "options": ["প্রধানমন্ত্রী রোজগার যোজনা", "জাতীয় গ্রামীণ কর্মসংস্থান নিশ্চয়তা আইন", "গ্রামীণ কর্মসংস্থান সৃষ্টি কর্মসূচি", "স্বর্ণজয়ন্তী গ্রাম স্বরোজগার যোজনা"], "answer": 0, "answer_source": "paper", "explain": "প্রধানমন্ত্রী রোজগার যোজনা (PMRY) ১৯৯৩ সালে শুরু হয়। ২০০৮ সালে এটি PMEGP-তে মিশে যায়। SGSY শুরু হয় ১৯৯৯ সালে, NREGA ২০০৫ সালে।"}, {"id": "sup17-78", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "'বিহার প্রাদেশিক কিষাণ সভা'-র প্রতিষ্ঠাতা কে?", "options": ["স্বামী সহজানন্দ", "পঞ্চানন শর্মা", "যদুনন্দন শর্মা", "রাহুল সাংকৃত্যায়ন"], "answer": 0, "answer_source": "paper", "explain": "স্বামী সহজানন্দ সরস্বতী ১৯২৯ সালে বিহার প্রাদেশিক কিষাণ সভা গঠন করেন। ১৯৩৬ সালে তিনি সর্বভারতীয় কিষাণ সভার প্রথম সভাপতি হন।"}, {"id": "sup17-79", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "দ্বিতীয় গোলটেবিল বৈঠকে যোগ দেওয়া ভারতের মহিলা প্রতিনিধি কে ছিলেন?", "options": ["সুচেতা কৃপালনী", "অরুণা আসফ আলি", "বিজয়লক্ষ্মী পণ্ডিত", "সরোজিনী নাইডু"], "answer": 3, "answer_source": "paper", "explain": "১৯৩১ সালে লন্ডনে দ্বিতীয় গোলটেবিল বৈঠকে গান্ধীজির সঙ্গে সরোজিনী নাইডু যোগ দেন। তিনি 'ভারতের নাইটিঙ্গেল' নামে পরিচিত।"}, {"id": "sup17-80", "paper": "সুপারভাইজার ২০১৭", "subject": "gk", "q": "'পাঞ্জাব নওজোয়ান ভারত সভা'-র প্রথম সম্পাদক কে ছিলেন?", "options": ["শিব বর্মা", "সুখদেব", "ভগৎ সিং", "চন্দ্রশেখর আজাদ"], "answer": 2, "answer_source": "paper", "explain": "১৯২৬ সালে লাহোরে ভগৎ সিং নওজোয়ান ভারত সভা গঠন করেন এবং তিনিই এর প্রথম সম্পাদক ছিলেন।"}];
const SUBJ = {math:"গণিত",health:"স্বাস্থ্য ও পুষ্টি",gk:"সাধারণ জ্ঞান",bengali:"বাংলা",english:"ইংরেজি",reasoning:"যুক্তি"};
const SUBJ_ORDER = ["math","health","gk","bengali","english","reasoning"];
const BN = n => String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const KEYS = ["ক","খ","গ","ঘ"];
const $ = s => document.querySelector(s);
// No browser storage: remove anything older versions of this page saved.
try{localStorage.removeItem("icds_hist");localStorage.removeItem("icds_fs")}catch(e){}

let st = {subj:"all", paper:"all", fs: 22, list:[], i:0, right:0, answered:false, picked:null, open:false};
document.documentElement.style.setProperty("--fs", st.fs+"px");

const papers = [...new Set(QUESTIONS.map(q=>q.paper))];
// Fixed sequence: same every time, subjects spread evenly through the whole list.
// Within each subject a seeded (constant) shuffle mixes papers; then each question
// gets slot (i+0.5)/count for its subject and everything is sorted by slot.
const FIXED = (()=>{
  let seed=20261109; const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
  const bySubj={}; QUESTIONS.forEach(q=>(bySubj[q.subject]??=[]).push(q));
  const keyed=[];
  Object.keys(bySubj).sort((a,b)=>SUBJ_ORDER.indexOf(a)-SUBJ_ORDER.indexOf(b)).forEach((sj,si)=>{
    const a=bySubj[sj].slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    a.forEach((q,i)=>keyed.push({q,k:(i+0.5)/a.length,si}));
  });
  return keyed.sort((x,y)=>x.k-y.k||x.si-y.si).map(x=>x.q);
})();
function pool(){return FIXED.filter(q=>(st.subj==="all"||q.subject===st.subj)&&(st.paper==="all"||q.paper===st.paper))}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function fontBtn(){return `<button class="iconbtn" id="fsBtn" aria-label="লেখা বড়/ছোট">অ ${st.fs>22?"−":"+"}</button>`}
function bindFont(){const b=$("#fsBtn"); if(b) b.onclick=()=>{st.fs = st.fs>22?22:27; document.documentElement.style.setProperty("--fs",st.fs+"px"); render()}}

function home(){
  const p=pool();
  const subjCount = s => QUESTIONS.filter(q=>(s==="all"||q.subject===s)&&(st.paper==="all"||q.paper===st.paper)).length;
  const paperCount = pp => QUESTIONS.filter(q=>(pp==="all"||q.paper===pp)&&(st.subj==="all"||q.subject===st.subj)).length;
  $("#app").innerHTML = `
  <div class="top"><div><h1>অঙ্গনওয়াড়ি পরীক্ষার প্রস্তুতি</h1><div class="tiny">আগের বছরের আসল প্রশ্ন · উত্তর ও ব্যাখ্যা সহ</div></div>${fontBtn()}</div>
  <div class="stats">
    <div class="stat"><b>${BN(QUESTIONS.length)}</b><span>মোট প্রশ্ন</span></div>
  </div>
  <div class="sec"><h2>বিষয় বেছে নিন</h2><div class="chips">
    <button class="chip" data-s="all" aria-pressed="${st.subj==="all"}">সব<span class="n">${BN(subjCount("all"))}</span></button>
    ${SUBJ_ORDER.filter(s=>subjCount(s)).map(s=>`<button class="chip" data-s="${s}" aria-pressed="${st.subj===s}">${SUBJ[s]}<span class="n">${BN(subjCount(s))}</span></button>`).join("")}
  </div></div>
  <div class="sec"><h2>প্রশ্নপত্র</h2><div class="chips">
    <button class="chip" data-p="all" aria-pressed="${st.paper==="all"}">সব</button>
    ${papers.map(pp=>`<button class="chip" data-p="${esc(pp)}" aria-pressed="${st.paper===pp}">${esc(pp)}<span class="n">${BN(paperCount(pp))}</span></button>`).join("")}
  </div></div>
  <button class="big" id="go" ${p.length?"":"disabled"}>শুরু করুন · ${BN(p.length)}টি প্রশ্ন</button>
  <p class="tiny">প্রশ্ন সবসময় একই ক্রমে আসবে — সব বিষয় মেশানো। উত্তর দেওয়ার পর <b>“আরও জানুন”</b> চাপলে বুঝিয়ে বলা থাকবে — অঙ্কের ক্ষেত্রে ধাপে ধাপে।</p>`;
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.subj=b.dataset.s;render()});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{st.paper=b.dataset.p;render()});
  $("#go").onclick=()=>start(pool());
  bindFont();
}
function start(list){st.list=list;st.i=0;st.right=0;st.view="quiz";newQ();render();window.scrollTo(0,0)}
function newQ(){st.answered=false;st.picked=null;st.open=false}

function quiz(){
  const q=st.list[st.i], n=st.list.length;
  const opts=q.options.map((o,j)=>{
    let cls="opt"; if(st.answered){ if(j===q.answer) cls+=" right"; else if(j===st.picked) cls+=" wrong"; }
    return `<button class="${cls}" data-j="${j}" ${st.answered?"disabled":""}><span class="k">${KEYS[j]}</span><span>${esc(o)}</span></button>`}).join("");
  const isOk = st.picked===q.answer;
  const src = q.answer_source==="paper" ? "উত্তরের উৎস: প্রশ্নপত্রের উত্তর-তালিকা (যাচাই করা)" : "উত্তরের উৎস: নিজে সমাধান ও যাচাই করা";
  $("#app").innerHTML = `
  <div class="bar"><button class="iconbtn" id="home" aria-label="প্রথম পাতা">← ফিরে যান</button><div class="prog"><i style="width:${(st.i)/n*100}%"></i></div><span class="count">${BN(st.i+1)}/${BN(n)}</span>${fontBtn()}</div>
  <div class="qcard">
    <div class="tags"><span class="tag">${SUBJ[q.subject]||""}</span><span class="tag paper">${esc(q.paper)}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${st.answered?`<div class="verdict ${isOk?"ok":"bad"}">${isOk?"✓ ঠিক উত্তর!":"✗ ভুল হয়েছে। সঠিক উত্তর: "+KEYS[q.answer]+") "+esc(q.options[q.answer])}</div>
      ${q.flag?`<div class="warn">${esc(q.flag)}</div>`:""}
      <button class="learn" id="learn" aria-expanded="${st.open}">${st.open?"ব্যাখ্যা লুকান":"আরও জানুন — কেন এই উত্তর?"}</button>
      ${st.open?`<div class="explain">${esc(q.explain)}<span class="src">${src}</span></div>`:""}`:""}
  </div>
  ${st.answered?`<div class="nav"><button class="big" id="next">${st.i+1<n?"পরের প্রশ্ন →":"ফলাফল দেখুন"}</button></div>`:`<p class="tiny" style="text-align:center">একটি উত্তরে চাপ দিন</p>`}
  <p class="tiny" style="text-align:center">এখন পর্যন্ত সঠিক: ${BN(st.right)}</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    st.picked=+b.dataset.j; st.answered=true; const ok=st.picked===q.answer; if(ok)st.right++; render()});
  const l=$("#learn"); if(l) l.onclick=()=>{st.open=!st.open;render()};
  const nx=$("#next"); if(nx) nx.onclick=()=>{ if(st.i+1<n){st.i++;newQ();render();window.scrollTo(0,0)} else {st.view="done";render()} };
  $("#home").onclick=()=>{st.view="home";render()};
  bindFont();
}
function done(){
  const n=st.list.length, pct=Math.round(st.right*100/n);
  $("#app").innerHTML = `<div class="qcard done">
    <div class="tiny">আপনার ফলাফল</div>
    <div class="score">${BN(st.right)}/${BN(n)}</div>
    <div>${pct>=80?"খুব ভালো! এভাবেই চালিয়ে যান।":pct>=50?"ভালো হয়েছে। ভুলগুলো আর একবার দেখে নিন।":"চিন্তা নেই — আবার অনুশীলন করলেই মনে থাকবে।"}</div>
  </div>
  <button class="big" id="h">প্রথম পাতায় যান</button>`;
  $("#h").onclick=()=>{st.view="home";render()};
}
function render(){ if(st.view==="quiz") quiz(); else if(st.view==="done") done(); else home(); }
render();
</script>
